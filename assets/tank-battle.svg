<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF2F8"/>
      <stop offset="0.55" stop-color="#F2ECFF"/>
      <stop offset="1" stop-color="#E9F7FF"/>
    </linearGradient>
    <linearGradient id="pinkTank" x1="80" y1="0" x2="270" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8FAB"/>
      <stop offset="1" stop-color="#FFB3C6"/>
    </linearGradient>
    <linearGradient id="blueTank" x1="680" y1="0" x2="870" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CC7FF"/>
      <stop offset="1" stop-color="#BDE0FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#A78BFA" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="960" height="320" rx="30" fill="url(#sky)"/>

  <g opacity="0.48">
