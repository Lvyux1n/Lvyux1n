      <circle cx="34" cy="70" r="13" fill="#38323D"/>
      <circle cx="84" cy="70" r="13" fill="#38323D"/>
      <circle cx="134" cy="70" r="13" fill="#38323D"/>
      <rect x="28" y="8" width="92" height="44" rx="18" fill="url(#pinkTank)"/>
      <rect x="108" y="25" width="74" height="12" rx="6" fill="#FF8FAB"/>
