    </circle>
    <circle cx="840" cy="62" r="44" fill="#DDF1FF">
      <animate attributeName="cx" values="840;812;840" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.8">
    <rect x="0" y="244" width="960" height="76" fill="#FFF8E7"/>
    <path d="M0 244C98 228 154 260 254 244C374 224 452 265 574 244C706 221 798 266 960 238V320H0V244Z" fill="#FDE2E4"/>
    <path d="M0 276H960" stroke="#F7B7C9" stroke-width="2" stroke-dasharray="8 14"/>
  </g>

  <g opacity="0.9">
