<svg width="960" height="250" viewBox="0 0 960 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="96" y1="0" x2="864" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4A261"/>
      <stop offset="0.38" stop-color="#FF8FAB"/>
      <stop offset="0.7" stop-color="#80B8FF"/>
      <stop offset="1" stop-color="#8FD694"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B56576" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="960" height="250" rx="28" fill="#FFFBF0"/>
  <path d="M90 48C218 18 294 70 420 48C548 25 646 14 862 44" stroke="url(#line)" stroke-width="4" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="8 16;20 10;8 16" dur="5s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#shadow)" font-family="Verdana, Arial, sans-serif">
    <rect x="70" y="76" width="246" height="124" rx="22" fill="#FFF1B8"/>
    <text x="104" y="114" font-size="22" font-weight="800" fill="#9B6A19">Birthday Wishes</text>
    <text x="104" y="146" font-size="15" fill="#7A6872">health, joy, courage</text>
    <text x="104" y="170" font-size="15" fill="#7A6872">a softer, brighter year</text>

    <rect x="358" y="76" width="246" height="124" rx="22" fill="#FFE6EE"/>
    <text x="392" y="114" font-size="22" font-weight="800" fill="#B63D73">Sweet Moments</text>
    <text x="392" y="146" font-size="15" fill="#6C6174">cake, photos, flowers</text>
    <text x="392" y="170" font-size="15" fill="#6C6174">little surprises saved</text>

    <rect x="646" y="76" width="246" height="124" rx="22" fill="#EAF7FF"/>
    <text x="676" y="114" font-size="20" font-weight="800" fill="#3576AA">Writing Studio</text>
    <text x="680" y="146" font-size="15" fill="#5D6C78">SEO pages and stories</text>
    <text x="680" y="170" font-size="15" fill="#5D6C78">still clear, now festive</text>
  </g>

  <g opacity="0.8">
    <circle cx="258" cy="64" r="6" fill="#FF8FAB"/>
    <rect x="514" y="42" width="10" height="10" rx="2" fill="#80ED99" transform="rotate(18 519 47)"/>
    <circle cx="802" cy="66" r="6" fill="#9B5DE5"/>
  </g>
</svg>
